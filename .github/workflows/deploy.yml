name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main, master]

permissions:
  contents: read

jobs:
  deploy:
    name: Build containers and deploy
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to production server
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" << 'EOF'

          set -e

          cd ~/alfacasebot/frontend-ml

          git pull --ff-only

          cd code

          docker compose up -d --build frontend ml

          docker compose ps

          curl --fail http://127.0.0.1:8081/ > /dev/null
          curl --fail http://127.0.0.1:5000/health

          EOF