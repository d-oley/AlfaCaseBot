services:
  ml:
    build:
      context: ../ml
      dockerfile: Dockerfile
    image: alfacasebot-ml:latest
    container_name: alfacasebot-ml
    environment:
      BACKEND_BASE_URL: http://host.docker.internal:8080
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: alfacasebot-frontend:latest
    container_name: alfacasebot-frontend
    ports:
      - "8081:80"
    depends_on:
      - ml
    restart: unless-stopped
